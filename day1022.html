<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <title>햄버거</title>
    <style>
        #mainback {
            width: 600px;
            border: 1px solid black;
            padding: 5px;
        }

        #head1 {
            background: url('images/hambuger.jpg') no-repeat left top;
            background-size: 100% 100%;
            width: 600px;
            height: 300px;
            margin-bottom: 5px;
        }

        div {
            width: 600px;
            border: 1px solid #ccc;
        }

        #xmr {
            border: 0px;
        }

        .red1 {
            color: red;
        }

        .blue1 {
            color: blue;
        }
    </style>
</head>

<body>
    <div id="mainback">
        <div id="head1" class="divall">
            <div id="xmr">
                <p>어쩌구</p>
            </div>
        </div>
        <div id="body1" class="divall">
            <div>
                <p>확인하세요</p>
            </div>
            <div>
                <h2 class="red1">주문 및 배송</h2>
                <p><span class="blue1">오후 2시 이전</span> 주문건은 당일 발송합니다<br>
                    2시 이후 주문 건은 다음날 발송합니다(주말 제외)</p>
            </div>
            <div>
                <h2 class="red1">교환 및 환불</h2>
                <p>불만족시 <span class="blue1">100% 환불</span>해 드립니다<br>
                    고객센터로 전화주세요</p>
            </div>
            <div>
                <h2 class="red1">고객센터</h2>
                <p>0000-0000</p>
                <p>상담시간 : 오전 9시 ~ 오후 6시 (토/일, 공휴일 휴무)</p>
            </div>
        </div>
    </div>
</body>

</html>
