<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <title>display 속성</title>
    <style>
        div {
            margin: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        #inline img{
            margin: 10px;
        }
        #block img{
            display: block;
            margin: 10px;
            width: 200px;
            height: 200px;
        }
    </style>
</head>

<body>
    <div id="inline">
        <img src="images/garlic.jpg">
        <img src="images/cheese.jpg">
        <img src="images/hambuger.jpg">
    </div>
    <div id="block">
        <img src="images/garlic.jpg">
        <img src="images/cheese.jpg">
        <img src="images/hambuger.jpg">
    </div>
</body>

</html>
