<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <title>플렉스 박스</title>
    
    <style>
        .wrapper{
            width: 500px;
            height: 150px;
            margin: 0 auto 20px;
            display: flex;
            -msflexwrap: wrap;
            -webkitflexwrao: wrap;
            flex-wrap: wrap;
            border: 2px solid black;
        }
        #container1 {
            -msaligncontent: flex-start;
            -webkitaligncontent: flex-start;
            align-content: flex-start;
        }
        #container2 {
            -msaligncontent: flex-end;
            -webkitaligncontent: flex-end;
            align-content: flex-end;
        }
        #container3 {
            -msaligncontent: center;
            -webkitaligncontent: center;
            align-content: center;
        }
        #container4 {
            -msaligncontent: space-between;
            -webkitaligncontent: space-between;
            align-content: space-between;
        }
        #container5 {
            -msaligncontent: space-around;
            -webkitaligncontent: space-around;
            align-content: space-around;
        }
        .wrapper div{
            width: 200px;
            border: 2px solid black;
            background: #ccc;
        }
        h1 {
            text-align: center;
        }
        p{
            font-weight: bold;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>align-content : flex-start (기본값)</h1>    
    <div id="container1" class="wrapper">
        <div><p>1</p></div>
        <div><p>2</p></div>
        <div><p>3</p></div>
    </div>
    <h1>align-content : flex-end</h1>    
    <div id="container2" class="wrapper">
        <div><p>1</p></div>
        <div><p>2</p></div>
        <div><p>3</p></div>
    </div>
    <h1>align-content : center</h1>    
    <div id="container3" class="wrapper">
        <div><p>1</p></div>
        <div><p>2</p></div>
        <div><p>3</p></div>
    </div>
    <h1>align-content : space-between</h1>    
    <div id="container4" class="wrapper">
        <div><p>1</p></div>
        <div><p>2</p></div>
        <div><p>3</p></div>
    </div>
    <h1>align-content : space-around</h1>    
    <div id="container5" class="wrapper">
        <div><p>1</p></div>
        <div><p>2</p></div>
        <div><p>3</p></div>
    </div>

</body>

</html>
