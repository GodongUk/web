<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>함수</title>
    <script>
        function ranDate() {
            var date = new Date();
            var x = date.getSeconds();
            var y = (x % 5) + 1;
            alert("난수 = " + y);
        }
    </script>
</head>

<body>
    <a href="#" onclick="ranDate()">난수 발생시키기</a>
</body>

</html>
