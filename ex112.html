<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width-device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>rayout </title>
    <style>
        * {
            margin: 5px 0;
            padding: 0;
        }

        #wrapper {
            width: 320px;
            margin: 10px;
        }

        header {
            width: 100%;
            height: 120px;
            background-color: #066cfa;
        }

        header h1 {
            margin: 0;
        }

        .rayout1 {
            position: relative;
            width: 318px;
            height: 100px;
            border: 1px solid green;

        }

        footer {
            clear: both;
            width: 100%;
            height: 100px;
            background-color: #c3590a;
            text-align: center;
        }

        footer p {
            margin: 0;
        }


        @media screen and (min-width:768px) and (max-width:1719px) {
            #wrapper {
                width: 570px;
                margin: 10px;
            }

            #div1 {
                width: 280px;
                height: 250px;
                border: 1px solid #0f0f0f33;
                float: left;
            }

            #div2 {
                width: 280px;
                height: 250px;
                border: 1px solid #0f0f0f33;
                float: right;
            }

            #div3 {
                width: 280px;
                height: 250px;
                border: 1px solid #0f0f0f33;
                float: left;
            }

            #div4 {
                width: 280px;
                height: 250px;
                border: 1px solid #0f0f0f33;
                float: right;
            }

            #div5 {
                clear: both;
                width: 570px;
                height: 250px;
                border: 1px solid #0f0f0f33;

            }
        }

        @media screen and (min-width:1720px) {
            #wrapper {
                width: 1710px;
            
            }
            #main1 div {
                margin: 0px 5px 5px 0px;
                padding: 5px;
            }
            #div1 {
                width: 550px;
                height: 250px;
                border: 1px solid #0f0f0f33;
                float: left;
            }

            #div2 {
                width: 550px;
                height: 250px;
                border: 1px solid #0f0f0f33;
                float: left;
            }

            #div3 {
                width: 550px;
                height: 250px;
                border: 1px solid #0f0f0f33;
                float: right;
            }

            #div4 {
                width: 550px;
                height: 250px;
                border: 1px solid #0f0f0f33;
                float: left;
            }

            #div5 {
                float: right;
                width: 1100px;
                height: 250px;
                border: 1px solid #0f0f0f33;

            }
        }
    </style>
</head>

<body>
    <div id="wrapper">
        <header>
            <h1>사이트 제목</h1>
        </header>
        <section id="main1">
            <div id="div1" class="rayout1">
                <p>첫번째 컨텐츠</p>
            </div>
            <div id="div2" class="rayout1">
                <p>두번째 컨텐츠</p>
            </div>
            <div id="div3" class="rayout1">
                <p>세번째 컨텐츠</p>
            </div>
            <div id="div4" class="rayout1">
                <p>네번째 컨텐츠</p>
            </div>
            <div id="div5" class="rayout1">
                <p>다섯번째 컨텐츠</p>
            </div>
        </section>
        <footer>
            <p>푸터 입니다.</p>
        </footer>
    </div>
</body>

</html>
