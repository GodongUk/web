<!DOCTYPE html>
<html lang="ko">


<head>
    <meta charset="UTF-8">
    <title> 로또 </title>
    <script>
        var num = [];
        // function compareNumbers(a,b){
        //                 return a-b;
        //             }
        for (var i = 0; i < 6; i++) {
            num[i] = Math.ceil(Math.random() * 45);
            for (var j = 0; j < i; j++) {
                if (num[i] == num[j]) {
                    i--;
                    break;
                }
            }
        }
        num.sort(function (a,b){
            return a - b;
        });
        

        document.write(num);
    </script>
</head>

</html>
