<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <title>배경 이미지</title>
    <style>
        div{
            width: 500px;
            height: 500px;
            border:2px double black;
            margin-bottom: 20px;
        }
        .bg1{
            background: url('images/bg4.jpg') no-repeat left top;
            background-size: auto;
        }
        .bg2{
            background: url('images/bg4.jpg') no-repeat left top;
            background-size: 200px 150px;
        }
        .bg3{
            background: url('images/bg4.jpg') no-repeat left top;
            background-size: 60% 40%;
        }
        .bg4{
            background: url('images/bg4.jpg') no-repeat left top;
            background-size: contain;
        }
        .bg5{
            background: url('images/bg4.jpg') no-repeat left top;
            background-size: cover;
        }
        .bg6{
            background: url('images/bg4.jpg') no-repeat left top;
            background-size: 100% 100%;
        }
    </style>
</head>

<body>
    <p>auto</p>
    <div class="bg1"></div>
    <p>200px 150px</p>
    <div class="bg2"></div>
    <p>60% 40%</p>
    <div class="bg3"></div>
    <p>contain</p>
    <div class="bg4"></div>
    <p>cover</p>
    <div class="bg5"></div>
    <p>100% 100%</p>
    <div class="bg6"></div>
</body>

</html>
