<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>오늘 해본거 정리</title>
        <style>
            table, th, td {
                border: 1px solid #ccc;
            }
            td {
                padding: 40px;
            }
            th {
                padding: 40px;
            }
        </style>
    </head>
    <body>
        <h1>큰 제목</h1>
        <h6>작은 제목</h6>
        <p>br은 줄 바꾸기 입니다. <br></p>
        <p>hr은 선 긋기입니다. <hr></p>
        <pre>
   pre =  있는 그대로 출력
이렇게 줄바뀐것도 그대로 출력

            공백도 그대로 출력
        </pre>
        <p>
            <strong>중요한 내용 강조</strong><br>
            <b>단순하게 굵게 표시</b>
        </p>
        <p>
            <em>흐름상 강조 (이탤릭)</em> <br>
            <i>단순 이탤릭채</i>
            <i><span style="color: red;">ㅎㅇㅎㅇ</span></i>
        </p>
        <p><mark>이건 형광으로 강조 mark</mark></p>
        <p><span style="color: blue;">이건 span 태그입니다. span은 인라인 요소</span> span에 style 적용 가능</p>
        <ul>
            <li>예시1
                <ol type="a">
                    <li>예시2</li>
                    <li>예시3</li>
                </ol>
            </li>
            <li>예시4
                <ol type="a" start="3">
                    <li>예시5</li>
                    <li>예시6</li>
                    <li>예시7</li>
                </ol>
            </li>
        </ul>
        <h2>표만들기</h2>
        <table>
            <tr>
                <th></th>
                <td colspan="3"></td>
            </tr>
            <tr>
                <th></th>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <th></th>
                <td></td>
                <td colspan="2"></td>
            </tr>
            <tr>
                <th></th>
                <td></td>
                <td></td>
                <td></td>
            </tr>
        </table>
    </body>
</html>
