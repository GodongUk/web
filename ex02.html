<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>텍스트 덩어리로 묶기</title>
    </head>
    <body>
        <h1>가장 큰 제목</h1>
        <h6>가장 작은 제목</h6>
        <p>
            입력한 내용 앞뒤로 빈 줄이 생기며
            <br>
            단락 내에서 줄이 바뀝니다.
        </p>
        <hr>
        <pre>
동해물과
            백두산이
    마르고
        </pre>
        <p>
            <strong>중요한 내용 강조</strong><br>
            <b>단순하게 굵게 표시</b>
        </p>
        <p>
            <em>흐름상 강조 (이탤릭)</em> <br>
            <i>단순 이탤릭채</i>
            <span style="color: beige;">gd</span>
        </p>
        

    </body>
</html>
